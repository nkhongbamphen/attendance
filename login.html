<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - เช็คชื่อนักเรียน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow p-4" style="width: 100%; max-width: 400px; border-radius: 15px;">
        <h3 class="text-center text-primary fw-bold mb-4">🔐 เข้าสู่ระบบคุณครู</h3>
        
        <div class="mb-3">
            <label class="form-label">ชื่อผู้ใช้ (Username)</label>
            <input type="text" id="username" class="form-control" placeholder="">
        </div>
        <div class="mb-4">
            <label class="form-label">รหัสผ่าน (Password)</label>
            <input type="password" id="password" class="form-control" placeholder="">
        </div>
        <button onclick="login()" class="btn btn-primary w-100 fw-bold fs-5 py-2">เข้าสู่ระบบ</button>
    </div>

    <script>
        const API_BASE_URL = "https://attendance-iudd.onrender.com/api"; 

        async function login() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (!user || !pass) {
                return Swal.fire('แจ้งเตือน', 'กรุณากรอกชื่อผู้ใช้งานและรหัสผ่านให้ครบ', 'warning');
            }

            Swal.fire({ title: 'กำลังตรวจสอบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                // 🌟 เปลี่ยนมาส่งข้อมูลแบบ JSON ตามที่ FastAPI ต้องการ
                const response = await fetch(`${API_BASE_URL}/login`, { 
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: user,
                        password: pass
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem("token", data.access_token);
                    
                    Swal.fire({
                        icon: 'success', title: 'ยินดีต้อนรับ!', text: 'เข้าสู่ระบบสำเร็จ',
                        timer: 1500, showConfirmButton: false
                    }).then(() => { window.location.href = "index.html"; });
                } else {
                    Swal.fire('เข้าสู่ระบบไม่สำเร็จ', 'ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง', 'error');
                }
            } catch (error) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
            }
        }
    </script>
</body>
</html>
