<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เช็คชื่อเข้าเรียน</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Sarabun', sans-serif;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 80px; /* เว้นที่ไว้ให้ปุ่มเซฟด้านล่าง */
        }
        .mobile-app-container {
            max-width: 450px;
            margin: 0 auto;
            padding: 20px 15px;
        }
        .app-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            font-size: 1.5rem;
            color: #6c757d;
            text-decoration: none;
            margin-right: 15px;
        }
        .student-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        /* แต่ง Radio Button ให้กลายเป็นปุ่มกดสวยๆ */
        .status-group {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }
        .btn-check:checked + .btn-outline-success { background-color: #198754; color: white; }
        .btn-check:checked + .btn-outline-danger { background-color: #dc3545; color: white; }
        .btn-check:checked + .btn-outline-warning { background-color: #ffc107; color: black; }
        .btn-check:checked + .btn-outline-secondary { background-color: #6c757d; color: white; }
        
        .status-btn {
            flex: 1;
            padding: 8px 0;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 8px;
        }
        
        /* ปุ่มเซฟลอยอยู่ด้านล่าง */
        .sticky-bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 15px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
            display: none; /* ซ่อนไว้ก่อน จะโชว์ตอนมีรายชื่อเด็ก */
            z-index: 1000;
        }
        .sticky-bottom-bar .btn {
            max-width: 450px;
            margin: 0 auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="mobile-app-container">
        
        <div class="app-header">
            <a href="index.html" class="back-btn">❮</a>
            <h4 class="fw-bold text-primary mb-0">✅ เช็คชื่อเข้าเรียน</h4>
        </div>

        <div class="card border-0 shadow-sm mb-4" style="border-radius: 15px;">
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label fw-bold small text-muted">รหัสวิชา</label>
                    <input type="text" id="course_id" class="form-control form-control-lg bg-light" placeholder="เช่น ว31101">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small text-muted">วันที่เช็คชื่อ</label>
                    <input type="date" id="attendance_date" class="form-control form-control-lg bg-light">
                </div>
                <button onclick="loadStudents()" class="btn btn-primary w-100 py-2 fw-bold rounded-3">
                    🔍 ดึงรายชื่อนักเรียน
                </button>
            </div>
        </div>

        <div id="student_list_container"></div>

    </div>

    <div class="sticky-bottom-bar" id="save_bar">
        <button onclick="saveAttendance()" class="btn btn-success py-3 fw-bold fs-5 rounded-pill shadow">
            💾 บันทึกการเช็คชื่อ
        </button>
    </div>

    <script>
        // 🌟 1. ดัก Token ก่อนเลย
        if (!localStorage.getItem("token")) {
            window.location.href = "login.html";
        }

        const API_BASE_URL = "https://attendance-iudd.onrender.com/api";
        
        // เซ็ตวันที่ปัจจุบันเป็นค่าเริ่มต้น
        document.getElementById('attendance_date').valueAsDate = new Date();

        let currentStudents = []; // เก็บรายชื่อเด็กชั่วคราว

        // 🌟 2. ฟังก์ชันดึงรายชื่อเด็กตามวิชา
        async function loadStudents() {
            const courseId = document.getElementById('course_id').value.trim();
            if(!courseId) return Swal.fire('แจ้งเตือน', 'กรุณากรอกรหัสวิชาก่อนครับ', 'warning');

            const container = document.getElementById('student_list_container');
            container.innerHTML = '<div class="text-center mt-5"><div class="spinner-border text-primary"></div><p class="mt-2 text-muted">กำลังดึงข้อมูล...</p></div>';

            try {
                // ⚠️ ต้องเช็คว่า API หลังบ้านคุณครูใช้ URL ไหนในการดึงเด็กในวิชานั้น (สมมติเป็น /students/{course_id})
                const response = await fetch(`${API_BASE_URL}/courses/${courseId}/students`, {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                });

                if (response.status === 401) {
                    return Swal.fire('หมดเวลา', 'กรุณาล็อคอินใหม่', 'warning').then(() => {
                        localStorage.removeItem("token"); window.location.href = "login.html";
                    });
                }
                
                if (!response.ok) throw new Error('ดึงข้อมูลไม่ได้');

                currentStudents = await response.json();

                if(currentStudents.length === 0) {
                    container.innerHTML = '<div class="alert alert-warning text-center">❌ ไม่พบนักเรียนในวิชานี้</div>';
                    document.getElementById('save_bar').style.display = 'none';
                    return;
                }

                // วาดการ์ดรายชื่อเด็ก
                container.innerHTML = '';
                currentStudents.forEach((student, index) => {
                    // ค่าเริ่มต้นให้ทุกคน "มาเรียน" (present)
                    const card = `
                        <div class="student-card" id="student_card_${student.student_id}">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h6 class="fw-bold mb-0">${student.student_id}</h6>
                                <span class="badge bg-light text-dark border">${student.name}</span>
                            </div>
                            
                            <div class="status-group">
                                <input type="radio" class="btn-check" name="status_${student.student_id}" id="present_${student.student_id}" value="present" checked>
                                <label class="btn btn-outline-success status-btn" for="present_${student.student_id}">มา</label>

                                <input type="radio" class="btn-check" name="status_${student.student_id}" id="absent_${student.student_id}" value="absent">
                                <label class="btn btn-outline-danger status-btn" for="absent_${student.student_id}">ขาด</label>

                                <input type="radio" class="btn-check" name="status_${student.student_id}" id="leave_${student.student_id}" value="leave">
                                <label class="btn btn-outline-warning status-btn" for="leave_${student.student_id}">ลา</label>

                                <input type="radio" class="btn-check" name="status_${student.student_id}" id="late_${student.student_id}" value="late">
                                <label class="btn btn-outline-secondary status-btn" for="late_${student.student_id}">สาย</label>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', card);
                });

                // โชว์ปุ่มเซฟด้านล่าง
                document.getElementById('save_bar').style.display = 'block';

            } catch (error) {
                container.innerHTML = `<div class="alert alert-danger text-center">เกิดข้อผิดพลาด: ${error.message}</div>`;
                document.getElementById('save_bar').style.display = 'none';
            }
        }

        // 🌟 3. ฟังก์ชันบันทึกการเช็คชื่อ
        async function saveAttendance() {
            const courseId = document.getElementById('course_id').value.trim();
            const date = document.getElementById('attendance_date').value;
            
            // รวบรวมข้อมูลสถานะของเด็กทุกคน
            const attendanceData = currentStudents.map(student => {
                const status = document.querySelector(`input[name="status_${student.student_id}"]:checked`).value;
                return {
                    student_id: student.student_id,
                    status: status
                };
            });

            const payload = {
                course_id: courseId,
                date: date,
                students: attendanceData
            };

            Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                // ⚠️ ต้องเช็คว่า API หลังบ้านคุณครูใช้ URL ไหนในการเซฟ (สมมติเป็น /attendance)
                const response = await fetch(`${API_BASE_URL}/attendance`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    },
                    body: JSON.stringify(payload)
                });

                if (response.status === 401) {
                    return Swal.fire('หมดเวลา', 'กรุณาล็อคอินใหม่', 'warning').then(() => {
                        localStorage.removeItem("token"); window.location.href = "login.html";
                    });
                }

                if (!response.ok) throw new Error('บันทึกไม่สำเร็จ');

                Swal.fire({
                    icon: 'success',
                    title: 'บันทึกสำเร็จ!',
                    text: `เช็คชื่อวิชา ${courseId} เรียบร้อยแล้ว`,
                    timer: 2000,
                    showConfirmButton: false
                }).then(() => {
                    // กลับไปหน้าหลัก หรือเคลียร์หน้าจอ
                    window.location.href = "index.html"; 
                });

            } catch (error) {
                Swal.fire('ข้อผิดพลาด', error.message, 'error');
            }
        }
    </script>
</body>
</html>
