<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สรุปการเช็คชื่อ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .mobile-app {
            max-width: 480px; 
            margin: 0 auto; 
            background-color: #f4f7f6; 
            min-height: 100vh;
        }
        .summary-box {
            border-radius: 12px;
            padding: 20px;
            color: white;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="mobile-app shadow-lg p-3">
        <div class="text-center mb-4 mt-3">
            <h4 class="fw-bold">📊 สรุปการเช็คชื่อ</h4>
            <p class="text-muted" id="course_info">วิชา: - | วันที่: -</p>
        </div>

        <div class="row g-2 mb-4">
            <div class="col-6"><div class="summary-box bg-success shadow-sm"><h2 id="count_present">0</h2><small>มาเรียน</small></div></div>
            <div class="col-6"><div class="summary-box bg-danger shadow-sm"><h2 id="count_absent">0</h2><small>ขาดเรียน</small></div></div>
            <div class="col-6"><div class="summary-box bg-warning text-dark shadow-sm"><h2 id="count_late">0</h2><small>สาย</small></div></div>
            <div class="col-6"><div class="summary-box bg-info shadow-sm"><h2 id="count_leave">0</h2><small>ลา</small></div></div>
        </div>

        <div class="text-start mb-4">
            <h6 class="fw-bold text-secondary mb-2">📋 รายชื่อผู้ที่ ขาด / ลา / สาย</h6>
            <ul id="abnormal_list" class="list-group shadow-sm" style="border-radius: 10px; overflow: hidden;">
                </ul>
        </div>
        
        <button onclick="submitToDatabase()" class="btn btn-primary w-100 py-3 rounded-pill shadow fs-5 fw-bold mb-3">
            💾 ยืนยันบันทึกเข้าฐานข้อมูล
        </button>
        <button onclick="goBack()" class="btn btn-outline-secondary w-100 py-2 rounded-pill fw-bold">
            ⬅️ กลับไปแก้ไข
        </button>
    </div>

    <script>
        // 🌟 ดักทาง: ถ้าไม่มีโทเคน (บัตรพนักงาน) ให้เตะกลับไปหน้าล็อคอิน
        if (!localStorage.getItem("token")) {
            window.location.href = "login.html";
        }

        const API_BASE_URL = "https://attendance-iudd.onrender.com/api";
        let sessionData = null;

        // 📌 1. ดึงข้อมูลที่ฝากไว้ตอนมาจากหน้า index.html (หรือ attendance.html)
        window.onload = function() {
            const dataStr = localStorage.getItem("attendanceSession");
            if (!dataStr) {
                Swal.fire('ไม่พบข้อมูล', 'กรุณาทำการเช็คชื่อจากหน้าแรกก่อนครับ', 'error').then(() => {
                    window.location.href = "attendance.html";
                });
                return;
            }

            sessionData = JSON.parse(dataStr);
            document.getElementById('course_info').innerText = `วิชา: ${sessionData.subject_id} | วันที่: ${sessionData.date} | จำนวน: ${sessionData.periods} คาบ`;

            // นับยอดสรุป
            let present = 0, absent = 0, late = 0, leave = 0;
            
            // 🌟 เตรียมตัวแปรเก็บ HTML สำหรับรายชื่อคนที่ไม่มาปกติ
            let listHTML = '';
            
            // 🌟 ตัวแปรช่วยแปลภาษาและกำหนดสีป้ายกำกับ
            const statusMap = {
                'absent': { label: 'ขาดเรียน', color: 'danger' },
                'late': { label: 'มาสาย', color: 'warning text-dark' },
                'leave': { label: 'ลา', color: 'info text-dark' }
            };

            sessionData.students.forEach(s => {
                if (s.status === 'present') {
                    present++;
                } else {
                    // ถ้าไม่ได้มาเรียนปกติ ให้นับยอดตามประเภท
                    if (s.status === 'absent') absent++;
                    else if (s.status === 'late') late++;
                    else if (s.status === 'leave') leave++;
                    
                    // 🌟 สร้าง HTML รายชื่อแทรกเข้าไป (อัปเดตให้แสดงชื่อและจัด Layout ให้สวยงาม)
                    const statusInfo = statusMap[s.status];
                    listHTML += `
                        <li class="list-group-item d-flex justify-content-between align-items-center bg-light py-2">
                            <div class="text-truncate" style="max-width: 75%;">
                                <span class="text-muted" style="font-size: 0.8rem;">รหัส: ${s.student_id}</span><br>
                                <strong class="text-dark">${s.name}</strong>
                            </div>
                            <span class="badge bg-${statusInfo.color} rounded-pill px-3 py-2 shadow-sm">${statusInfo.label}</span>
                        </li>
                    `;
                }
            });

            // อัปเดตตัวเลขในกล่อง 4 สี
            document.getElementById('count_present').innerText = present;
            document.getElementById('count_absent').innerText = absent;
            document.getElementById('count_late').innerText = late;
            document.getElementById('count_leave').innerText = leave;

            // 🌟 อัปเดตรายชื่อลงในหน้าเว็บ
            const listContainer = document.getElementById('abnormal_list');
            if (listHTML === '') {
                // ถ้ามาครบทุกคน จะโชว์ข้อความน่ารักๆ
                listContainer.innerHTML = '<li class="list-group-item text-center text-success fw-bold py-3">🎉 มาเรียนครบทุกคนครับ!</li>';
            } else {
                listContainer.innerHTML = listHTML;
            }
        };

        // 📌 2. ส่งข้อมูลเข้า Database จริงๆ
        async function submitToDatabase() {
            if (!sessionData) return;

            Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            // เตรียมข้อมูลให้ตรงกับที่ API ต้องการ
            const payload = {
                course_id: sessionData.subject_id,
                date: sessionData.date,
                periods: sessionData.periods, // 🌟 ส่งจำนวนคาบไปให้ฐานข้อมูล
                students: sessionData.students.map(s => ({
                    student_id: s.student_id,
                    status: s.status
                }))
            };

            try {
                const res = await fetch(`${API_BASE_URL}/attendance`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('token') // 🌟 เพิ่มบัตรพนักงานตรงนี้ครับ!
                    },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    const result = await res.json();
                    Swal.fire({
                        icon: 'success',
                        title: 'บันทึกสำเร็จ!',
                        text: result.message,
                        confirmButtonText: 'กลับหน้าแรก'
                    }).then(() => {
                        localStorage.removeItem("attendanceSession"); // ล้างความจำ
                        window.location.href = "attendance.html"; // เด้งกลับหน้าแรก
                    });
                } else if (res.status === 401) {
                    // 🌟 ถ้าบัตรหมดอายุ หรือปลอมแปลงบัตร
                    Swal.fire('หมดเวลาเชื่อมต่อ', 'กรุณาล็อคอินใหม่อีกครั้ง', 'warning').then(() => {
                        localStorage.removeItem("token");
                        window.location.href = "login.html";
                    });
                } else {
                    Swal.fire('ข้อผิดพลาด', 'บันทึกข้อมูลไม่สำเร็จ', 'error');
                }
            } catch (err) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
            }
        }

        function goBack() {
            window.location.href = "attendance.html";
        }
    </script>
</body>
</html>
