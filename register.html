<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการข้อมูลพื้นฐาน</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        .mobile-app {
            max-width: 480px; 
            margin: 0 auto; 
            background-color: #f4f7f6; 
            min-height: 100vh;
            padding-bottom: 30px;
        }
        .form-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="mobile-app shadow-lg position-relative">
        
        <div class="bg-primary text-white p-3 rounded-bottom-4 shadow-sm mb-4">
            <h5 class="mb-1">📝 ระบบจัดการข้อมูลพื้นฐาน</h5>
            <p class="mb-0 opacity-75 small">เพิ่มนักเรียน รายวิชา และลงทะเบียน</p>
        </div>

        <div class="px-3">
            
            
            <div class="form-card border-start border-4 border-success">
                <h6 class="fw-bold text-success mb-3">👨‍🎓 1. เพิ่มรายชื่อนักเรียนใหม่</h6>
                <div class="mb-2">
                    <input type="number" id="stu_id" class="form-control" placeholder="รหัสนักเรียน (เช่น 1)">
                </div>
                <div class="mb-2">
                    <input type="text" id="stu_name" class="form-control" placeholder="ชื่อ-นามสกุล (เช่น ด.ช.สมชาย ใจดี)">
                </div>
                <button onclick="addStudent()" class="btn btn-outline-success w-100 fw-bold">+ บันทึกนักเรียน</button>

                <hr class="my-3">
                <h6 class="fw-bold text-secondary mb-2 fs-6">📁 หรือ อัปโหลดจากไฟล์ CSV</h6>
                <div class="input-group mb-2">
                    <input type="file" id="student_csv" class="form-control" accept=".csv">
                </div>
                <button onclick="uploadStudentCSV()" class="btn btn-success w-100 fw-bold">⬆️ อัปโหลดไฟล์ CSV</button>
            </div>

            <div class="form-card border-start border-4 border-info">
                <h6 class="fw-bold text-info mb-3">📚 2. เพิ่มรายวิชาใหม่</h6>
                <div class="mb-2">
                    <input type="text" id="course_id" class="form-control" placeholder="รหัสวิชา (เช่น ว31101)">
                </div>
                <div class="mb-2">
                    <input type="text" id="course_name" class="form-control" placeholder="ชื่อวิชา (เช่น การเขียนเว็บเพจ)">
                </div>
                <button onclick="addCourse()" class="btn btn-outline-info w-100 fw-bold">+ บันทึกรายวิชา</button>
            </div>

            <div class="form-card border-start border-4 border-warning">
                <h6 class="fw-bold text-warning mb-3">🔗 3. นำนักเรียนเข้าวิชาเรียน</h6>
                <div class="mb-3">
                    <label class="small fw-bold text-muted">รหัสวิชาเป้าหมาย</label>
                    <input type="text" id="enroll_course_id" class="form-control border-warning" placeholder="เช่น ว31101 (ต้องใส่ทุกครั้ง)">
                </div>
                
                <hr class="my-3">
                
                <label class="small fw-bold text-muted">ตัวเลือกที่ 1: เลือกลงตามห้องเรียน</label>
                <div class="input-group mb-3">
                    <input type="text" id="enroll_grade" class="form-control" placeholder="ชั้น (เช่น ม.4)">
                    <input type="text" id="enroll_room" class="form-control" placeholder="ห้อง (เช่น 1)">
                    <button onclick="enrollByClass()" class="btn btn-warning text-dark fw-bold">ลงทั้งห้อง</button>
                </div>

                <label class="small fw-bold text-muted">ตัวเลือกที่ 2: เลือกลงรายบุคคล</label>
                <div class="input-group mb-3">
                    <input type="number" id="enroll_stu_id" class="form-control" placeholder="รหัสนักเรียน">
                    <button onclick="enrollStudent()" class="btn btn-outline-warning text-dark fw-bold">ลงรายคน</button>
                </div>
                
            </div>

            <a href="index.html" class="btn btn-secondary w-100 mt-3 py-2 fw-bold">🏠 กลับหน้าหลัก</a>

        </div>
    </div>

    <script>
        // ⚠️ อย่าลืมเช็คเลข Port ให้ตรงกับที่รัน uvicorn ไว้นะครับ (เช่น 8000 หรือ 8001)
        const API_BASE_URL = "http://127.0.0.1:8000/api";

        // 📌 1. ฟังก์ชันส่งข้อมูลนักเรียน (เวอร์ชันเปลี่ยนร่างป๊อปอัป)
        async function addStudent() {
            const id = document.getElementById('stu_id').value;
            const name = document.getElementById('stu_name').value;
            if(!id || !name) return Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลนักเรียนให้ครบ', 'warning');

            Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const res = await fetch(`${API_BASE_URL}/students`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ student_id: parseInt(id), name: name })
                });
                
                if(res.ok) {
                    Swal.fire('สำเร็จ', `บันทึกนักเรียน ${name} เรียบร้อย`, 'success');
                    document.getElementById('stu_id').value = '';
                    document.getElementById('stu_name').value = '';
                } else {
                    Swal.fire('ข้อผิดพลาด', 'ไม่สามารถบันทึกได้ (รหัสอาจซ้ำในระบบ)', 'error');
                }
            } catch (err) { 
                Swal.fire('ข้อผิดพลาด', 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้', 'error'); 
            }
        }

        // 📌 2. ฟังก์ชันส่งข้อมูลวิชา
        async function addCourse() {
            const id = document.getElementById('course_id').value;
            const name = document.getElementById('course_name').value;
            if(!id || !name) return Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลวิชาให้ครบ', 'warning');

            Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const res = await fetch(`${API_BASE_URL}/courses`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ course_id: id, course_name: name })
                });
                
                if(res.ok) {
                    Swal.fire('สำเร็จ', `บันทึกวิชา ${name} เรียบร้อย`, 'success');
                    document.getElementById('course_id').value = '';
                    document.getElementById('course_name').value = '';
                } else {
                    Swal.fire('ข้อผิดพลาด', 'ไม่สามารถบันทึกได้ (รหัสวิชาอาจซ้ำ)', 'error');
                }
            } catch (err) { 
                Swal.fire('ข้อผิดพลาด', 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้', 'error'); 
            }
        }

        // 📌 3. ฟังก์ชันลงทะเบียน นำเด็กเข้าวิชา
        async function enrollStudent() {
            const stu_id = document.getElementById('enroll_stu_id').value;
            const course_id = document.getElementById('enroll_course_id').value;
            if(!stu_id || !course_id) return Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลลงทะเบียนให้ครบ', 'warning');

            Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const res = await fetch(`${API_BASE_URL}/enrollments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ student_id: parseInt(stu_id), course_id: course_id })
                });
                
                if(res.ok) {
                    Swal.fire('สำเร็จ', `นำรหัสนักเรียน ${stu_id} เข้าวิชา ${course_id} เรียบร้อย`, 'success');
                    document.getElementById('enroll_stu_id').value = '';
                    document.getElementById('enroll_course_id').value = '';
                } else {
                    Swal.fire('ข้อผิดพลาด', 'ไม่สามารถลงทะเบียนได้', 'error');
                }
            } catch (err) { 
                Swal.fire('ข้อผิดพลาด', 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้', 'error'); 
            }
        }

        // 🌟 อัปเดตฟังก์ชันอ่านไฟล์ CSV ให้รองรับ คอลัมน์ที่ 3 (ชั้น) และ 4 (ห้อง)
        function uploadStudentCSV() {
            const fileInput = document.getElementById('student_csv');
            if (!fileInput.files.length) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกไฟล์ CSV ก่อน', 'warning');

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                const text = e.target.result.replace(/^\uFEFF/, ''); 
                const rows = text.split(/\r?\n/); 
                let studentList = [];

                for (let i = 0; i < rows.length; i++) {
                    if (rows[i].trim() === '') continue; 
                    const cols = rows[i].split(',');
                    if (cols.length >= 2) {
                        const stu_id = parseInt(cols[0].trim());
                        const stu_name = cols[1].trim();
                        // อ่านคอลัมน์ชั้นและห้อง (ถ้าไม่มีให้ใส่ขีด -)
                        const stu_grade = cols[2] ? cols[2].trim() : "-"; 
                        const stu_room = cols[3] ? cols[3].trim() : "-";
                        
                        if (!isNaN(stu_id) && stu_name !== "") {
                            studentList.push({ student_id: stu_id, name: stu_name, grade: stu_grade, room: stu_room });
                        }
                    }
                }

                if (studentList.length === 0) return Swal.fire('ข้อผิดพลาด', 'อ่านข้อมูลไม่ได้', 'error');

                try {
                    Swal.fire({ title: 'กำลังอัปโหลด...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                    const res = await fetch(`${API_BASE_URL}/students/bulk`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ students: studentList })
                    });
                    const data = await res.json();
                    if(res.ok) {
                        Swal.fire({ icon: 'success', title: 'สำเร็จ!', text: data.message });
                        fileInput.value = ''; 
                    } else Swal.fire('ข้อผิดพลาด', 'เซิร์ฟเวอร์ตอบกลับผิดพลาด', 'error');
                } catch (err) { Swal.fire('ข้อผิดพลาด', 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้', 'error'); }
            };
            reader.readAsText(file, 'UTF-8');
        }

        // 📌 ฟังก์ชันใหม่: ลงทะเบียนรายห้อง/รายชั้น
        async function enrollByClass() {
            const course_id = document.getElementById('enroll_course_id').value;
            const grade = document.getElementById('enroll_grade').value;
            const room = document.getElementById('enroll_room').value;

            if(!course_id) return Swal.fire('แจ้งเตือน', 'กรุณากรอกรหัสวิชาเป้าหมายก่อนครับ', 'warning');
            if(!grade && !room) return Swal.fire('แจ้งเตือน', 'กรุณาระบุชั้น หรือ ห้อง อย่างน้อย 1 อย่างครับ', 'warning');

            Swal.fire({ title: 'กำลังดึงข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const res = await fetch(`${API_BASE_URL}/enrollments/by-class`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ course_id: course_id, grade: grade, room: room })
                });
                
                const data = await res.json();
                if(res.ok) {
                    Swal.fire('สำเร็จ', data.message, 'success');
                    document.getElementById('enroll_grade').value = '';
                    document.getElementById('enroll_room').value = '';
                } else {
                    Swal.fire('ข้อผิดพลาด', data.detail || 'ไม่พบนักเรียนในชั้น/ห้องนี้', 'error');
                }
            } catch (err) { 
                Swal.fire('ข้อผิดพลาด', 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้', 'error'); 
            }
        }

        // 📌 ฟังก์ชันลงทะเบียนเหมาเข่ง
        async function enrollAllStudents() {
            const course_id = document.getElementById('enroll_course_id').value;
            if(!course_id) return Swal.fire('แจ้งเตือน', 'กรุณากรอกแค่รหัสวิชา (ไม่ต้องใส่รหัสเด็ก) แล้วกดปุ่มเหมาเข่งได้เลยครับ', 'warning');

            Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const res = await fetch(`${API_BASE_URL}/enrollments/all`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ course_id: course_id })
                });
                
                const data = await res.json();
                if(res.ok) {
                    Swal.fire('สำเร็จ', data.message, 'success');
                } else {
                    Swal.fire('ข้อผิดพลาด', 'ไม่สามารถลงทะเบียนได้', 'error');
                }
            } catch (err) { 
                Swal.fire('ข้อผิดพลาด', 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้', 'error'); 
            }
        }
    </script>
</body>
</html>
